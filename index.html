<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="src/reset.css">
  <link rel="stylesheet" type="text/css" href="src/style.css">
  <title>Frontend Mentor | Entertainment web app</title>
</head>
<body class="bg-blue-950 font-[Outfit] flex flex-col gap-6">

    <nav class="fixed flex-row z-9999 flex w-full h-14 bg-blue-900 justify-between items-center px-4 md:rounded-xl md:mx-5 md:w-[calc(100%-2rem)] md:my-4 duration-500 lg:flex-col lg:h-[calc(100%-2rem)] lg:w-16 lg:mx-5 md:duration-0 lg:justify-start lg:items-center lg:gap-14 lg:py-6">
      <button id="logo_home_button"><img src="assets/logo.svg" class="w-6.25" alt="Brand logo for entertainment web app in top navigation"></button>
        <div class="flex flex-row gap-6 lg:flex-col items-start lg:gap-10">
          <button id="home_button"> 
            <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" id="home_button_svg" class="w-4 h-4 text-blue-500 hover:text-white transition-all duration-200" alt="icon-nav-home.svg"><path d="M8 0H1C.4 0 0 .4 0 1v7c0 .6.4 1 1 1h7c.6 0 1-.4 1-1V1c0-.6-.4-1-1-1Zm0 11H1c-.6 0-1 .4-1 1v7c0 .6.4 1 1 1h7c.6 0 1-.4 1-1v-7c0-.6-.4-1-1-1ZM19 0h-7c-.6 0-1 .4-1 1v7c0 .6.4 1 1 1h7c.6 0 1-.4 1-1V1c0-.6-.4-1-1-1Zm0 11h-7c-.6 0-1 .4-1 1v7c0 .6.4 1 1 1h7c.6 0 1-.4 1-1v-7c0-.6-.4-1-1-1Z" fill="currentColor"/></svg>
          </button>
          <button id="movies_button">
            <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" id="movies_button_svg" class="w-4 h-4 text-blue-500 hover:text-white transition-all duration-200" alt="icon-nav-movies.svg"><path d="M16.956 0H3.044A3.044 3.044 0 0 0 0 3.044v13.912A3.044 3.044 0 0 0 3.044 20h13.912A3.044 3.044 0 0 0 20 16.956V3.044A3.044 3.044 0 0 0 16.956 0ZM4 9H2V7h2v2Zm-2 2h2v2H2v-2Zm16-2h-2V7h2v2Zm-2 2h2v2h-2v-2Zm2-8.26V4h-2V2h1.26a.74.74 0 0 1 .74.74ZM2.74 2H4v2H2V2.74A.74.74 0 0 1 2.74 2ZM2 17.26V16h2v2H2.74a.74.74 0 0 1-.74-.74Zm16 0a.74.74 0 0 1-.74.74H16v-2h２v1.２６Z" fill="currentColor"/></svg>
          </button>
          <button id="tv-series_button">
            <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" id="tv-series_button_svg" class="w-4 h-4 text-blue-500 hover:text-white transition-all duration-200" alt="icon-nav-tv-series.svg"><path d="M20 4.481H9.08l2.7-3.278L10.22 0 7 3.909 3.78.029 2.22 1.203l2.7 3.278H0V20h20V4.481Zm-8 13.58H2V6.42h10v11.64Zm5-3.88h-2v-1.94h2v1.94Zm0-3.88h-2V8.36h2v1.94Z" fill="currentColor"/></svg>
          </button>
          <button id="bookmarked_button">
            <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" id="bookmarked_button_svg" class="w-4 h-4 text-blue-500 hover:text-white transition-all duration-200" alt="icon-nav-bookmarked.svg"><path d="M15.387 0c.202 0 .396.04.581.119.291.115.522.295.694.542.172.247.258.52.258.82v17.038c0 .3-.086.573-.258.82a1.49 1.49 0 0 1-.694.542 1.49 1.49 0 0 1-.581.106c-.423 0-.79-.141-1.098-.423L8.46 13.959l-5.83 5.605c-.317.29-.682.436-1.097.436-.202 0-.396-.04-.581-.119a1.49 1.49 0 0 1-.694-.542A1.402 1.402 0 0 1 0 18.52V1.481c0-.3.086-.573.258-.82A1.49 1.49 0 0 1 .952.119C1.137.039 1.33 0 1.533 0h13.854Z" fill="currentColor"/></svg>
          </button>
        </div>
      <div class="border-white border-2 rounded-full w-6 h-6 lg:mt-auto"><button><img src="assets/image-avatar.png" class="w-6 h-auto" alt="User avatar photo"></button></div>
    </nav>


    <main class="flex flex-col gap-6 mt-18 px-4 md:px-5 md:mt-22 lg:mt-8 duration-200 lg:ml-20">

      <div class="flex flex-row gap-4 items-center">
        <img src="assets/icon-search.svg" alt="Search icon" class="w-6 h-6 ">
        <input id="search_input" type="search" class=" text-white md:w-full text-lg bg-transparent border-b caret-red-500 border-transparent focus:border-white outline-none pb-1 transition-colors duration-100 translate-y-0.5" placeholder="Search for movies and TV series"/>
      </div>

      <div id="search_container" class="hidden">
        <h1 id="search_heading" class="text-2xl mb-4 text-white font-light">Found <span id="search_qty"></span> results for '<span id="search_title"></span>'</h1>
        <div id="search_output" class="grid grid-cols-1 gap-[clamp(1rem,2.5vw,1.5rem)] min-[560px]:grid-cols-3 min-[400px]:grid-cols-2 min-[1240px]:grid-cols-4 min-[1480px]:grid-cols-5"></div>
      </div>

      <section id="home">

        <!-- Trending  -->
        <div class="flex flex-col gap-4 ">
          <h1 id="trending-title" class="text-2xl text-white font-light">Trending</h1>
          <div id="trending" class="flex flex-row gap-4 md:gap-8 overflow-x-scroll flex-nowrap pb-4"></div>
        </div>

        <!-- Recomended -->
        <div >
          <h2 id="recommended-title" class="text-xl text-white font-light mt-4 mb-2">Recommended for you</h2>
          <div id="recommended" class="grid grid-cols-1 gap-[clamp(1rem,2.5vw,1.5rem)] min-[560px]:grid-cols-3 min-[400px]:grid-cols-2 min-[1240px]:grid-cols-4 min-[1480px]:grid-cols-5"></div>
        </div>
      </section>

      <section id="movies" class="hidden">
        <h2 class="text-2xl text-white font-light mt-0 mb-4">Movies</h2>
        <div id="movies_container" class="grid grid-cols-1 gap-[clamp(1rem,2.5vw,1.5rem)] min-[560px]:grid-cols-3 min-[400px]:grid-cols-2 min-[1240px]:grid-cols-4 min-[1480px]:grid-cols-5"></div>
      </section>

      <section id="tv-series" class="hidden">
        <h2 class="text-2xl text-white font-light mt-0 mb-4">TV Series</h2>
        <div id="tv-series_container" class="grid grid-cols-1 gap-[clamp(1rem,2.5vw,1.5rem)] min-[560px]:grid-cols-3 min-[400px]:grid-cols-2 min-[1240px]:grid-cols-4 min-[1480px]:grid-cols-5"></div>
      </section>

      <section id="bookmarked" class="hidden">
        <h2 id="no-bookmarked" class="text-2xl text-white font-light mt-0 mb-4">No Bookmarked items yet</h2>
        <h2 id="bookmarked-movies" class="text-2xl text-white font-light mt-0 mb-4 hidden">Bookmarked Movies</h2>
        <div id="bookmarked_movies_container" class="grid grid-cols-1 gap-[clamp(1rem,2.5vw,1.5rem)] min-[560px]:grid-cols-3 min-[400px]:grid-cols-2 min-[1240px]:grid-cols-4 min-[1480px]:grid-cols-5"></div>
        <h2 id="bookmarked-series" class="text-2xl text-white font-light mt-4 mb-4 hidden">Bookmarked TV Series</h2>
        <div id="bookmarked_tv-series_container" class="grid grid-cols-1 gap-[clamp(1rem,2.5vw,1.5rem)] min-[560px]:grid-cols-3 min-[400px]:grid-cols-2 min-[1240px]:grid-cols-4 min-[1480px]:grid-cols-5"></div>
      </section>

  </main>






  <script type="module" src="src/main.js"></script>
</body>
</html>
